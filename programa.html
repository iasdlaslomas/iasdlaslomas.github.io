<script>
// Programa: lo que se publica desde el panel (Firebase) y, mientras tanto, programa.json.
// La semana es la del sábado que viene (hoy, si es sábado). Con ?semana=AAAA-MM-DD se ve otra.
function cargarPrograma() {
  var FS = 'https://firestore.googleapis.com/v1/projects/iasdlaslomas/databases/(default)/documents';
  var CLAVE = 'AIzaSyCDgVsWuUtPrE5oQT46-wNha5mWbI_yqes';
  function iso(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  var pedida = (/[?&]semana=(\d{4}-\d{2}-\d{2})/.exec(location.search) || [])[1];
  var base = pedida ? new Date(pedida + 'T12:00:00') : new Date();
  base.setDate(base.getDate() + (6 - base.getDay() + 7) % 7);
  var sabado = iso(base);
  function valor(v) {
    if (!v) return null;
    if ('stringValue' in v) return v.stringValue;
    if ('integerValue' in v) return Number(v.integerValue);
    if ('doubleValue' in v) return v.doubleValue;
    if ('booleanValue' in v) return v.booleanValue;
    if ('timestampValue' in v) return v.timestampValue;
    if ('arrayValue' in v) return (v.arrayValue.values || []).map(valor);
    if ('mapValue' in v) { var o = {}, f = v.mapValue.fields || {}; for (var k in f) o[k] = valor(f[k]); return o; }
    return null;
  }
  function norm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim(); }
  var HORA = { 'escuela sabatica': '09:30', 'culto divino': '11:00', 'culto joven': '18:00' };
  function clave(b) {
    var ini = '';
    (b.partes || []).some(function (x) { return (ini = x && x.inicio) ? true : false; });
    var m = /^(\d{1,2}):(\d{2})/.exec(ini || '');
    var h = m ? ('0' + m[1]).slice(-2) + ':' + m[2] : (HORA[norm(b.titulo)] || '23:59');
    return (b.fecha || sabado) + ' ' + h;
  }
  var deFirebase = fetch(FS + '/semanas/' + sabado + '/bloques?pageSize=50&key=' + CLAVE, { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : {}; })
    .then(function (j) {
      return (j.documents || []).map(function (d) { var o = {}, f = d.fields || {}; for (var k in f) o[k] = valor(f[k]); return o; });
    })
    .catch(function () { return []; });
  // El diseño del programa (Canva, presentación…) es uno por sábado y vive en el documento de la semana
  var deSemana = fetch(FS + '/semanas/' + sabado + '?key=' + CLAVE, { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : {}; })
    .then(function (j) { return (j.fields && j.fields.enlace && valor(j.fields.enlace)) || ''; })
    .catch(function () { return ''; });
  var delArchivo = fetch('programa.json', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .catch(function () { return null; });
  return Promise.all([deFirebase, delArchivo, deSemana]).then(function (res) {
    var bloques = res[0].slice(), pj = res[1], enlace = res[2];
    var titulos = bloques.map(function (b) { return norm(b.titulo); });
    if (pj && pj.bloques && pj.fecha === sabado) {
      pj.bloques.forEach(function (b) { if (b && titulos.indexOf(norm(b.titulo)) < 0) bloques.push(b); });
    }
    if (!bloques.length) { if (pj && enlace) pj.enlace = enlace; return pj; }   // nada nuevo: programa.json tal cual (incluye el formato v1)
    bloques.forEach(function (b) { if (!b.fecha) b.fecha = sabado; });
    bloques.sort(function (a, b) { var x = clave(a), y = clave(b); return x < y ? -1 : x > y ? 1 : 0; });
    return { version: 2, fecha: sabado, bloques: bloques, enlace: enlace };
  });
}
// Fondo del encabezado que cada bloque escoge en el panel. Solo se aceptan colores #RRGGBB
// e imágenes del almacenamiento de la iglesia; cualquier otra cosa se ignora y queda el de siempre.
var RE_HEX = /^#[0-9a-fA-F]{6}$/;
function esClaro(hex) {
  var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return 0.299 * r + 0.587 * g + 0.114 * b > 165;
}
function estiloFondo(f) {
  if (!f || typeof f !== 'object') return null;
  if (f.tipo === 'color' && RE_HEX.test(f.color || '')) return { css: f.color, claro: esClaro(f.color) };
  if (f.tipo === 'degradado' && RE_HEX.test(f.de || '') && RE_HEX.test(f.a || ''))
    return { css: 'linear-gradient(135deg, ' + f.de + ', ' + f.a + ')', claro: esClaro(f.de) && esClaro(f.a) };
  if (f.tipo === 'imagen' && typeof f.url === 'string' && f.url.indexOf('https://firebasestorage.googleapis.com/') === 0 && !/["'()\\\s<>]/.test(f.url))
    return { css: 'linear-gradient(rgba(22, 22, 22, .48), rgba(22, 22, 22, .62)), url("' + f.url + '") center / cover no-repeat', claro: false };
  return null;
}
function diaDeBloque(bl, p) {
  var f = new Date(((bl && bl.fecha) || p.fecha) + 'T12:00:00');
  var d = f.toLocaleDateString('es-MX', { weekday: 'long' }) + ' ' + f.toLocaleDateString('es-MX', { day: 'numeric', month: 'long' });
  return d.charAt(0).toUpperCase() + d.slice(1);
}
(function () {
  cargarPrograma()
    .then(function (p) {
      if (!p) throw 0;
      if (p.fecha && new Date(p.fecha + 'T23:59:59') < new Date()) throw 0;

      function fechaLarga() {
        if (!p.fecha) return 'Este sábado';
        var f = new Date(p.fecha + 'T12:00:00');
        return 'Sábado ' + f.toLocaleDateString('es-MX', { day: 'numeric', month: 'long' });
      }
      function textoRecursos(r) {
        var t = [];
        if (r.microfonosVoz) t.push(r.microfonosVoz + (r.microfonosVoz === 1 ? ' micrófono de voz' : ' micrófonos de voz'));
        if (r.microfonosInstrumento) t.push(r.microfonosInstrumento + (r.microfonosInstrumento === 1 ? ' micrófono de instrumento' : ' micrófonos de instrumento'));
        if (r.otros) t.push(r.otros);
        return t.join(' · ');
      }

      // Enlaces a fuentes oficiales (no copiamos letras ni texto bíblico: derechos de autor).
      function chipAbrir(url, texto) {
        var a = document.createElement('a');
        a.className = 'abrir';
        a.href = url; a.target = '_blank'; a.rel = 'noopener';
        a.textContent = texto;
        return a;
      }
      function urlHimno(texto) {
        var m = /himno\s*#?\s*(\d+)/i.exec(texto || '');
        return m ? 'https://www.nuevohimnario.com/Himno?no=' + m[1] : null;
      }
      var LIBROS = {'genesis':'GEN','exodo':'EXO','levitico':'LEV','numeros':'NUM','deuteronomio':'DEU','josue':'JOS','jueces':'JDG','rut':'RUT','1 samuel':'1SA','2 samuel':'2SA','1 reyes':'1KI','2 reyes':'2KI','1 cronicas':'1CH','2 cronicas':'2CH','esdras':'EZR','nehemias':'NEH','ester':'EST','job':'JOB','salmo':'PSA','salmos':'PSA','proverbios':'PRO','eclesiastes':'ECC','cantares':'SNG','isaias':'ISA','jeremias':'JER','lamentaciones':'LAM','ezequiel':'EZK','daniel':'DAN','oseas':'HOS','joel':'JOL','amos':'AMO','abdias':'OBA','jonas':'JON','miqueas':'MIC','nahum':'NAM','habacuc':'HAB','sofonias':'ZEP','hageo':'HAG','zacarias':'ZEC','malaquias':'MAL','mateo':'MAT','marcos':'MRK','lucas':'LUK','juan':'JHN','hechos':'ACT','romanos':'ROM','1 corintios':'1CO','2 corintios':'2CO','galatas':'GAL','efesios':'EPH','filipenses':'PHP','colosenses':'COL','1 tesalonicenses':'1TH','2 tesalonicenses':'2TH','1 timoteo':'1TI','2 timoteo':'2TI','tito':'TIT','filemon':'PHM','hebreos':'HEB','santiago':'JAS','1 pedro':'1PE','2 pedro':'2PE','1 juan':'1JN','2 juan':'2JN','3 juan':'3JN','judas':'JUD','apocalipsis':'REV'};
      function sinAcentos(s) { return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
      function urlVersiculo(texto) {
        if (!texto) return null;
        var re = /((?:[123]\s+)?[A-Za-z\u00c0-\u017e]+)\s+(\d+)(?:\s*:\s*(\d+(?:\s*-\s*\d+)?)|\s*[\u2013-]\s*\d+)?/g;
        var m;
        while ((m = re.exec(texto)) !== null) {
          var libro = LIBROS[sinAcentos(m[1]).replace(/\s+/g, ' ').trim()];
          if (!libro) continue;
          var url = 'https://www.bible.com/es/bible/149/' + libro + '.' + m[2];
          if (m[3]) url += '.' + m[3].replace(/\s/g, '');
          return url + '.RVR1960';
        }
        return null;
      }

      if (p.bloques && p.bloques.length) {
        // Formato v2: una tarjeta por bloque (Escuela Sabática, Culto Divino, Culto Joven…).
        var cont = document.getElementById('programa-bloques');
        var pinto = false, hayRecursos = false;
        // Diseño del programa: un solo botón para todo el sábado (antes venía uno por bloque; se toma el primero)
        var diseno = p.enlace || '', vd = null;
        if (!diseno) p.bloques.some(function (bl) { return (diseno = (bl && bl.enlace) || ''); });
        if (/^https?:\/\//i.test(diseno)) {
          vd = document.createElement('a');
          vd.className = 'ver-diseno-semana'; vd.href = diseno; vd.target = '_blank'; vd.rel = 'noopener';
          vd.textContent = '🎨 Ver el programa diseñado ↗';
        }
        p.bloques.forEach(function (bl) {
          if (!bl || !bl.titulo) return;
          var partes = (bl.partes || []).filter(function (x) { return x && x.seccion; });
          if (!partes.length) return;
          pinto = true;

          var card = document.createElement('div'); card.className = 'schedule';
          var head = document.createElement('div'); head.className = 'head';
          var stF = estiloFondo(bl.fondo);
          if (stF) { head.style.background = stF.css; head.classList.add('con-fondo'); if (stF.claro) head.classList.add('claro'); }
          var day = document.createElement('div'); day.className = 'day'; day.textContent = diaDeBloque(bl, p); head.appendChild(day);
          var tit = document.createElement('div'); tit.className = 'title'; tit.textContent = bl.titulo; head.appendChild(tit);
          if (bl.tema) { var tm = document.createElement('div'); tm.className = 'tema'; tm.textContent = bl.tema; head.appendChild(tm); }
          if (bl.tema) {
            var uvt = urlVersiculo(bl.tema);
            if (uvt) {
              var at = chipAbrir(uvt, 'Ver pasaje ↗');
              at.className = 'ver-diseno';
              head.appendChild(at);
            }
          }
          card.appendChild(head);

          partes.forEach(function (x) {
            var s = document.createElement('div'); s.className = 'slot';
            var t = document.createElement('div'); t.className = 'time';
            t.textContent = x.inicio ? (x.inicio + (x.fin ? '–' + x.fin : '')) : '·';
            s.appendChild(t);
            var w = document.createElement('div'); w.className = 'what';
            var b = document.createElement('b'); b.textContent = x.seccion; w.appendChild(b);
            if (x.encargado) { var sp = document.createElement('span'); sp.textContent = x.encargado; w.appendChild(sp); }
            if (x.detalle) { var d = document.createElement('span'); d.className = 'det'; d.textContent = x.detalle; w.appendChild(d); }
            var uh = urlHimno(x.seccion);
            if (uh) w.appendChild(chipAbrir(uh, 'Ver letra ↗'));
            var uv = urlVersiculo(((x.seccion || '') + ' | ' + (x.detalle || '')));
            if (uv && !uh) w.appendChild(chipAbrir(uv, 'Ver versículo ↗'));
            var rec = x.recursos ? textoRecursos(x.recursos) : (x.multimedia || '');
            if (rec) {
              hayRecursos = true;
              var m = document.createElement('span'); m.className = 'rec'; m.textContent = '🎤 Recursos: ' + rec;
              w.appendChild(m);
            }
            // Pistas (pueden ser varias; antes era una sola en «pista») y enlaces (videos, presentaciones…)
            var pistasX = (x.pistas && x.pistas.length ? x.pistas : (x.pista ? [x.pista] : []))
              .map(function (pp) { return typeof pp === 'string' ? pp : ((pp && pp.url) || ''); }).filter(Boolean);
            pistasX.forEach(function (src) {
              hayRecursos = true;
              var au = document.createElement('audio');
              au.controls = true; au.preload = 'none'; au.src = src;
              au.style.cssText = 'display:block;margin-top:6px;width:100%;max-width:320px;height:32px;';
              w.appendChild(au);
            });
            ((x.recursos && x.recursos.enlaces) || []).forEach(function (e) {
              if (!e || typeof e.url !== 'string' || !/^https?:\/\/[^\s"'<>]+$/i.test(e.url)) return;
              hayRecursos = true;
              var esVideo = /youtube\.com|youtu\.be|vimeo\.com/i.test(e.url);
              w.appendChild(chipAbrir(e.url, (esVideo ? '🎬 ' : '🔗 ') + (e.nombre || 'Abrir') + ' ↗'));
            });
            s.appendChild(w); card.appendChild(s);
          });

          var pie = [];
          if (bl.piano) pie.push('Piano: ' + bl.piano);
          if (bl.batuta) pie.push('Batuta: ' + bl.batuta);
          if (pie.length) {
            var pd = document.createElement('div'); pd.className = 'pie'; pd.textContent = pie.join(' · ');
            card.appendChild(pd);
          }
          cont.appendChild(card);
        });
        if (!pinto) throw 0;
        if (vd) cont.insertBefore(vd, cont.firstChild);   // el botón del diseño, arriba de los programas
      } else if (p.partes && p.partes.length) {
        // Formato v1 (compatibilidad).
        var lista = document.getElementById('programa-lista');
        p.partes.forEach(function (x) {
          if (!x || !x.parte) return;
          var s = document.createElement('div'); s.className = 'slot';
          var t = document.createElement('div'); t.className = 'time'; t.textContent = x.hora || '·'; s.appendChild(t);
          var w = document.createElement('div'); w.className = 'what';
          var b = document.createElement('b'); b.textContent = x.parte; w.appendChild(b);
          if (x.encargado) { var sp = document.createElement('span'); sp.textContent = x.encargado; w.appendChild(sp); }
          s.appendChild(w); lista.appendChild(s);
        });
        document.getElementById('programa-fecha').textContent = fechaLarga();
        document.getElementById('programa-card').hidden = false;
      } else {
        throw 0;
      }
    })
    .catch(function () { document.getElementById('programa-vacio').hidden = false; });
})();
</script>
<script>
(function () {
  var t = document.querySelector('.nav-toggle'), n = document.querySelector('.nav nav');
  if (!t || !n) return;
  t.addEventListener('click', function () {
    var abierto = n.classList.toggle('abierto');
    t.setAttribute('aria-expanded', abierto ? 'true' : 'false');
  });
  n.addEventListener('click', function (e) {
    if (e.target.closest('a')) { n.classList.remove('abierto'); t.setAttribute('aria-expanded', 'false'); }
  });
})();
</script>
</body>
</html>
